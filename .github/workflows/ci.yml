name: laravel-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find app bootstrap public routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Laravel boot and routes
        run: |
          cp .env.example .env
          php artisan route:list
      - name: Pint
        run: vendor/bin/pint --test
      - name: Composer audit
        run: composer audit --locked
      - name: Build image
        run: docker build -t sky-laravel-api:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-laravel-api:ci -u)" != "0"
